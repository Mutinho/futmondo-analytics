# Fly.io configuration — Backend (FastAPI)
# App name will be set on first deploy: fly launch --name futmondo-api
app = "futmondo-api"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  API_HOST = "0.0.0.0"
  API_PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  # Coste ~0€: la máquina se detiene sin tráfico y arranca bajo demanda.
  # Antes: auto_stop_machines="off" + min_machines_running=1 → máquina 24/7
  # (la causa del cargo de segundos-core en la factura de Fly).
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  max_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[checks]
  [checks.health]
    type = "http"
    port = 8000
    path = "/health"
    interval = "30s"
    timeout = "5s"
