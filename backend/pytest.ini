[pytest]
# El runner se ejecuta DESDE backend/ para que `from app...` resuelva, como hace
# el test existente (test_analytics_service.py). Ver unit-test-instructions.md (R-01).
testpaths = tests
pythonpath = .
# Piso de cobertura BLOQUEANTE (FR11): line-coverage total, sin --cov-branch.
# Valor medido exacto SIN margen sobre la suite estabilizada (cobertura real
# 27.52%; piso = 27, el entero que la suite supera de forma estable sin flapping
# de redondeo). El ratchet SOLO sube; si aparece flapping se arregla el test
# no-determinista, NUNCA se baja el piso. Requiere --cov=app en la invocacion
# (ci.yml y el job verify de fly-deploy.yml lo pasan, en paridad).
addopts = -ra --cov-fail-under=27
# Cobertura como métrica informativa cuando se activa con --cov=app; el piso de
# arriba solo aplica cuando la medición de cobertura está activa.
filterwarnings =
    ignore::DeprecationWarning
