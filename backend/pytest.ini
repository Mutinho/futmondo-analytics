[pytest]
# El runner se ejecuta DESDE backend/ para que `from app...` resuelva, como hace
# el test existente (test_analytics_service.py). Ver unit-test-instructions.md (R-01).
testpaths = tests
pythonpath = .
addopts = -ra
# Cobertura como métrica informativa (sin piso fijo/bloqueante todavía; trinquete
# en trabajos posteriores). Activar con: python -m pytest tests --cov=app
filterwarnings =
    ignore::DeprecationWarning
