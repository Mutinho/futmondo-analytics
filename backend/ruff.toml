# Configuración base de ruff (lint + formato) para el backend.
#
# Escalonado (Code Style afirmado + R-05): arranca en modo TOLERANTE (advisory)
# para no romper el gate de golpe sobre la base heredada sin formatear. El gate
# de CI ejecuta `ruff check` en modo advisory (continue-on-error) en esta fase;
# se pasará a bloqueante en un trabajo posterior, tras un formateo inicial en un
# commit aislado y saneada la deuda.

target-version = "py312"
line-length = 100

[lint]
# Conjunto mínimo inicial: errores/warnings de pyflakes (F) y pycodestyle (E),
# más imports (I). Se ampliará por trinquete en trabajos posteriores.
select = ["E", "F", "I"]
# Silencios pragmáticos para la base heredada (se reducirán con el tiempo):
#  E501 line-too-long — muchas líneas largas heredadas; se formatea gradualmente.
#  E402 module-import-not-at-top — patrón de imports diferidos existente.
# E722 (bare-except) re-habilitado como ADVISORY por trinquete (FR3.2.3, Q2):
# se quita del ignore para que `ruff check` lo reporte; ruff SIGUE advisory (no
# bloqueante). Cambio de config aislado, sin `--fix` ni `ruff format`.
ignore = ["E501", "E402"]

[lint.per-file-ignores]
# Los tests pueden usar imports tras setear variables de entorno (E402) y
# fixtures que parecen no usadas.
"tests/**" = ["E402", "F401"]
"conftest.py" = ["E402"]
# God-files heredados (regla afirmada: NUNCA ampliarlos ni reescribirlos). Su
# deuda de lint queda REGISTRADA aquí en vez de sanearse tocando el fichero, al
# promover `ruff check` a bloqueante. Saneo diferido a un refactor dedicado.
#  - data_manager_v2.py (~166 KB): E722 (bare-except) = deuda registrada afirmada.
#  - data_sync_service.py (~84 KB), assistant_service.py (~51 KB): imports.
"app/services/data_manager_v2.py" = ["E722", "F841", "F401", "I001"]
"app/services/data_sync_service.py" = ["F401", "I001"]
"app/services/assistant_service.py" = ["I001"]
# photo_service.py: el bare-except (E722) es deuda registrada afirmada (Q6); el
# resto de su deuda sí se sanea de forma quirúrgica (no está en el ignore).
"app/services/photo_service.py" = ["E722", "F841"]

[format]
quote-style = "double"
indent-style = "space"
