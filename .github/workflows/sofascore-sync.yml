name: Sofascore Sync (Fly one-shot)

# Runs the Sofascore batch sync on a one-shot Fly.io machine (cost ~0: the
# machine only exists for the ~3 min the sync takes, then self-destroys).
#
# It REUSES the already-deployed futmondo-cron image (no extra build/deploy),
# overriding the entrypoint to run the Sofascore script instead of uvicorn.
# The image is refreshed daily by daily-sync.yml, so it always contains the
# latest script.
#
# If this ever starts getting 403s (Sofascore blocked the datacenter IP), run
# the script manually from a residential IP:
#   python3 backend/scripts/sync_sofascore_local.py

on:
  workflow_dispatch:
  schedule:
    # Diario a las 5:00 UTC = 7:00 CET (tras el daily-sync de las 4:30 UTC)
    - cron: '0 5 * * *'

jobs:
  sofascore:
    name: Sofascore batch sync (Fly)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Run Sofascore sync on a one-shot Fly machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: futmondo-cron
        run: |
          set -euo pipefail

          # Resolve the current image of the cron app (already deployed, no build).
          IMAGE_REF=$(flyctl image show --app "$FLY_APP" --json \
            | jq -r '.[0] | "registry.fly.io/\(.Repository):\(.Tag)"')
          if [ -z "$IMAGE_REF" ] || [ "$IMAGE_REF" = "registry.fly.io/:" ]; then
            echo "❌ Could not resolve cron image reference"
            flyctl image show --app "$FLY_APP" --json
            exit 1
          fi
          echo "Using image: $IMAGE_REF"

          # Launch a one-shot machine in the same region as the cron app.
          # --rm  : machine is destroyed after the process exits (cost 0 idle).
          # --entrypoint "sh -c '...'" : run our script; the inherited uvicorn CMD
          #   is passed as a positional arg to sh and ignored by 'sh -c'.
          # DATABASE_URL is inherited from the app's Fly secrets.
          flyctl machine run "$IMAGE_REF" \
            --app "$FLY_APP" \
            --region cdg \
            --vm-memory 256 \
            --rm \
            --entrypoint "sh -c 'python scripts/sync_sofascore_local.py'"
