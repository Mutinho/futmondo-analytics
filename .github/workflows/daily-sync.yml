name: Daily Sync (Cron)

on:
  schedule:
    # 4:30 UTC = 6:30 CET (Central European Time)
    - cron: '30 4 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  sync:
    name: Run Full Sync
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy cron image
        working-directory: ./backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy --config ../cron/fly.toml --ha=false

      - name: Start the cron machine and wait for the sync to finish
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          POLL_TIMEOUT_SECONDS: "600"   # 10 min hard cap for the data sync
        run: |
          set -euo pipefail

          # Wait for deploy to finish replacing the machine
          echo "Waiting for machine to be ready after deploy..."
          sleep 10

          # Get the machine ID (filter out destroyed/replacing machines)
          MACHINE_ID=""
          for i in 1 2 3 4 5; do
            MACHINE_ID=$(flyctl machines list --app futmondo-cron --json | jq -r '[.[] | select(.state != "destroying" and .state != "replacing")][0].id')
            if [ -n "$MACHINE_ID" ] && [ "$MACHINE_ID" != "null" ]; then
              echo "Found machine: $MACHINE_ID (attempt $i)"
              break
            fi
            echo "No ready machine found (attempt $i), waiting 10s..."
            sleep 10
          done

          if [ -z "$MACHINE_ID" ] || [ "$MACHINE_ID" = "null" ]; then
            echo "Error: Could not find a valid machine after 5 attempts"
            flyctl machines list --app futmondo-cron
            exit 1
          fi

          echo "Starting machine: $MACHINE_ID"
          flyctl machine start "$MACHINE_ID" --app futmondo-cron

          # --- Wait until the one-shot process finishes (machine stops) ---
          echo "⏳ Waiting for sync to finish..."
          elapsed=0
          state=""
          # Give it a moment to leave 'stopped' before we start polling.
          sleep 15
          while [ "$elapsed" -lt "$POLL_TIMEOUT_SECONDS" ]; do
            state=$(flyctl machines list --app futmondo-cron --json \
              | jq -r --arg id "$MACHINE_ID" '.[] | select(.id==$id) | .state')
            if [ "$state" = "stopped" ]; then
              echo "✅ Machine stopped after ~${elapsed}s"
              break
            fi
            sleep 10
            elapsed=$((elapsed + 10))
          done

          # --- Dump the sync logs into the Action output ---
          echo "===== Daily sync logs ====="
          flyctl logs --app futmondo-cron --machine "$MACHINE_ID" --no-tail 2>&1 \
            | sed -E 's/\x1b\[[0-9;]*m//g' \
            | grep -vE 'Preparing to run|api proxy|SSH listening|Firecracker|Starting init|Pulling container|Successfully prepared|Configuring firecracker' \
            || true
          echo "===== end logs ====="

          if [ "$state" != "stopped" ]; then
            echo "❌ Sync did not finish within ${POLL_TIMEOUT_SECONDS}s (state=$state)"
            exit 1
          fi

          # --- Verify the process exit code (with retries; the event can lag) ---
          EXIT_CODE=""
          for attempt in 1 2 3 4 5 6; do
            EXIT_CODE=$(flyctl machines list --app futmondo-cron --json \
              | jq -r --arg id "$MACHINE_ID" \
                '[.[] | select(.id==$id) | .events[]? | select(.request.exit_event) | .request.exit_event.exit_code] | first // empty' \
              2>/dev/null || true)
            [ -n "$EXIT_CODE" ] && break
            sleep 5
          done
          echo "Process exit code: ${EXIT_CODE:-<unavailable>}"

          # Decide success/failure. Fall back to the log summary if exit code lags.
          LOGS=$(flyctl logs --app futmondo-cron --machine "$MACHINE_ID" --no-tail 2>&1 | sed -E 's/\x1b\[[0-9;]*m//g')
          if [ "$EXIT_CODE" = "0" ]; then
            echo "✅ Daily sync completed successfully"
          elif [ -z "$EXIT_CODE" ] && echo "$LOGS" | grep -q "championships OK"; then
            echo "✅ Daily sync completed (verified via log summary; exit code unavailable)"
          else
            echo "❌ Daily sync failed (exit code ${EXIT_CODE:-<unavailable>})"
            exit 1
          fi
