name: Railway Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Deploy to Railway
        uses: bervProject/railway-deploy@v3.0.0
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          service: backend  # or frontend, depending on which service you want to deploy

