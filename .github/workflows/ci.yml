name: CI Gate

# FR8.1 / NFR4.1: gate de calidad en cada Pull Request hacia `main`. Ningún
# cambio se fusiona sin que este workflow pase (combinado con branch protection:
# marcar el job `quality` como required status check en `main`).
#
# Escalonado (R-05): ruff/ESLint y el escaneo de dependencias arrancan en modo
# ADVISORY (no bloquean todavía). Los TESTS (pytest, ng test) y el escaneo de
# SECRETOS (gitleaks) son BLOQUEANTES desde el inicio.

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Lint + Tests + Scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # gitleaks necesita el historial para escanear commits del PR.
          fetch-depth: 0

      # --- Secret scanning (BLOQUEANTE desde el inicio) ---
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- Backend: Python / pytest ---
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff lint — BLOQUEANTE
        # FR12: promovido a bloqueante (ultimo paso del escalon), tras sanear la
        # deuda por fichero y registrar los god-files en per-file-ignores. Sin
        # --fix ni ruff format: es un cambio de config aislado.
        working-directory: ./backend
        run: |
          pip install ruff==0.16.9
          ruff check .

      - name: Backend tests (pytest con cobertura) — BLOQUEANTE
        working-directory: ./backend
        env:
          # NFR1.1: el arranque del servicio web exige un secreto no-default; en
          # CI se inyecta uno efímero y no productivo para que la app importe.
          JWT_SECRET: ci-ephemeral-secret-not-a-real-one
        run: python -m pytest tests -q --cov=app --cov-report=term-missing

      - name: Allowlist expiry check (pip-audit) — BLOQUEANTE
        # NFR-SEC.3: una entrada de la allowlist caducada vuelve a bloquear.
        run: bash scripts/check-allowlist-expiry.sh backend/.pip-audit-allowlist

      - name: Dependency audit (pip-audit, entorno instalado) — BLOQUEANTE
        # FR12/NFR-SEC.1: audita el entorno YA instalado (sin -r) para un gate
        # reproducible; bloquea todo finding CON fix. Los findings SIN fix se
        # gobiernan por la allowlist versionada (--ignore-vuln), nunca silenciando.
        working-directory: ./backend
        run: |
          pip install pip-audit==2.10.1
          IGNORE=$(grep -vE '^\s*#|^\s*$' .pip-audit-allowlist 2>/dev/null | awk '{printf " --ignore-vuln %s", $1}')
          pip-audit $IGNORE

      # --- Frontend: Angular ---
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: ./angular-app
        run: npm ci

      - name: ESLint (advisory)
        working-directory: ./angular-app
        continue-on-error: true
        run: npx ng lint || echo "ESLint advisory — no bloquea todavia"

      - name: Frontend tests (ng test con Vitest + cobertura por metrica) — BLOQUEANTE
        # FR17.1: `ng test` ejerce la cobertura y sus umbrales por metrica
        # (lines/branches/functions/statements) declarados en el target `test`
        # de angular.json (builder @angular/build:unit-test). Si la cobertura
        # cae por debajo del umbral, el builder sale con codigo != 0 y el job
        # falla — el enforcement vive DENTRO de `ng test`, sin pasos extra ni
        # `continue-on-error`. Umbral = trinquete manual (solo sube).
        working-directory: ./angular-app
        run: npx ng test --watch=false

      - name: Dependency audit (npm audit, high) — BLOQUEANTE
        # FR12: promovido a bloqueante en `high` (0 findings a fecha de promocion).
        # El trinquete de severidad solo endurece (critical->high), nunca se relaja.
        working-directory: ./angular-app
        run: npm audit --audit-level=high
