# ===========================================
# Futmondo Analytics — Docker Compose
# ===========================================
# Arrancar:  docker compose up --build
# Parar:     docker compose down
# ===========================================
# URLs:
#   Frontend → http://futmondo.localhost
#   Backend  → http://futmondo-api.localhost
# ===========================================

services:
  # --- Reverse Proxy (nginx) ---
  proxy:
    image: nginx:alpine
    container_name: futmondo-proxy
    ports:
      - "80:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped

  # --- Backend: FastAPI + SQLite ---
  backend:
    build: ./backend
    container_name: futmondo-backend
    env_file: .env
    environment:
      - DATABASE_TYPE=sqlite
      - DATABASE_PATH=/app/data/futmondo_data.db
      - API_HOST=0.0.0.0
      - API_PORT=8000
    volumes:
      - db-data:/app/data
      - ./backend/static:/app/static
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  # --- Frontend: Angular (nginx) ---
  frontend:
    build: ./angular-app
    container_name: futmondo-frontend
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
    driver: local
