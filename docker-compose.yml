services:
  # Backend - FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: futmondo-backend
    ports:
      - "8081:8000"
    environment:
      - FUTMONDO_EMAIL=${FUTMONDO_EMAIL}
      - FUTMONDO_PASSWORD=${FUTMONDO_PASSWORD}
      - CHAMPIONSHIP_ID=${CHAMPIONSHIP_ID:-599b0e413f8a751620554699}
      - LEAGUE_ID=${LEAGUE_ID:-504e4f584d8bec9a67000079}
      - BASE_URL=${BASE_URL:-https://api.futmondo.com}
      - DATABASE_PATH=/app/data/futmondo_data.db
      # PostgreSQL settings (default to postgresql)
      - DATABASE_TYPE=${DATABASE_TYPE:-postgresql}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-futmondo}
      - POSTGRES_USER=${POSTGRES_USER:-futmondo}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-futmondo123}
      - DATABASE_URL=${DATABASE_URL:-}
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - CACHE_DURATION_HOURS=24
    volumes:
      - ./backend/data:/app/data
      - ./backend/static:/app/static
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - futmondo-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend - Node.js/Express
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: futmondo-frontend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - API_URL=http://backend:8000
      - NGROK_ENABLED=${NGROK_ENABLED:-false}
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:-}
    depends_on:
      - backend
    networks:
      - futmondo-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: futmondo-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-futmondo}
      - POSTGRES_USER=${POSTGRES_USER:-futmondo}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-futmondo123}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    networks:
      - futmondo-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-futmondo}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # pgAdmin - Para gestionar PostgreSQL
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: futmondo-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@futmondo.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin123}
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    ports:
      - "${PGADMIN_PORT:-5051}:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - futmondo-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/misc/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  futmondo-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
