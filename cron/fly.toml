# Fly.io configuration — Cron Sync (one-shot machine)
# This app runs the sync script and exits.
# Triggered daily via GitHub Actions using `flyctl machine run`.
# Build context = backend/ (same Dockerfile as the API, different process).
app = "futmondo-cron"
primary_region = "cdg"

[build]
  dockerfile = "../backend/Dockerfile"

[processes]
  app = "python scripts/sync_data.py"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[deploy]
  strategy = "immediate"

# No http_service — this is a worker/cron process, not a web app.
# The machine must be explicitly started after deploy.
