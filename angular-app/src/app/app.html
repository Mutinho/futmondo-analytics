<mat-sidenav-container class="app-container">
  <!-- Sidebar -->
  <mat-sidenav
    #sidenav
    [mode]="isMobile() ? 'over' : 'side'"
    [opened]="!isMobile()"
    class="app-sidenav"
  >
    <div class="sidenav-header">
      <span class="logo">🏆</span>
      <span class="app-name">Futmondo</span>
    </div>

    <!-- Selector de campeonato -->
    @if (championshipService.championships().length > 1) {
      <div class="championship-selector">
        <mat-form-field appearance="outline" class="championship-field">
          <mat-label>Campeonato</mat-label>
          <mat-select
            [value]="championshipService.activeChampionship()"
            (selectionChange)="onChampionshipChange($event.value)"
          >
            @for (c of championshipService.championships(); track c.championship_id) {
              <mat-option [value]="c">{{ c.name }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>
    }

    <mat-nav-list>
      @for (item of navItems(); track item.route) {
        <a
          mat-list-item
          [routerLink]="item.route"
          routerLinkActive="active-link"
          (click)="isMobile() && sidenav.close()"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <!-- Main content -->
  <mat-sidenav-content class="app-content">
    <!-- Top toolbar (mobile) -->
    <mat-toolbar class="app-toolbar">
      @if (isMobile()) {
        <button mat-icon-button (click)="sidenav.toggle()">
          <mat-icon>menu</mat-icon>
        </button>
      }
      <span class="toolbar-title">🏆 Futmondo</span>
      <span class="spacer"></span>
      <button mat-icon-button (click)="toggleDarkMode()" [title]="darkMode() ? 'Modo claro' : 'Modo oscuro'">
        <mat-icon>{{ darkMode() ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>
    </mat-toolbar>

    <!-- Page content -->
    <main class="page-content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
