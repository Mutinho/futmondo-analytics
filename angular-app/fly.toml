# Fly.io configuration — Frontend (Angular + nginx)
# App name will be set on first deploy: fly launch --name futmondo-app
app = "futmondo-app"
primary_region = "mad"

[build]
  dockerfile = "Dockerfile"
  [build.args]
    NGINX_CONF = "nginx.prod.conf"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[checks]
  [checks.health]
    type = "http"
    port = 80
    path = "/"
    interval = "30s"
    timeout = "5s"
