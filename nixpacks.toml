# Nixpacks configuration for Railway
# Railway uses Nixpacks to detect and build applications
# This file helps Railway understand the project structure

[phases.setup]
nixPkgs = ["python311", "nodejs-18_x"]

[phases.install]
cmds = [
  "cd backend && pip install -r requirements.txt",
  "cd frontend && npm ci --omit=dev"
]

[phases.build]
cmds = [
  "echo 'Build complete'"
]

[start]
cmd = "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"

